<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Proteus Viewer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".25" cy=".15" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>
  <!-- side traces, PCB style with 45° bends -->
  <g fill="none" stroke="#93c5fd" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M37 35l8 8h8"/>
    <path d="M43 18l6-6h4"/>
  </g>
  <circle cx="53" cy="43" r="2.8" fill="#93c5fd"/>
  <circle cx="53.5" cy="12" r="2.4" fill="#93c5fd"/>
  <!-- the P, drawn as a copper trace -->
  <path d="M21 49V15h15a10 10 0 0 1 0 20H21" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- through-hole pad at the foot -->
  <circle cx="21" cy="50" r="5.6" fill="#fff"/>
  <circle cx="21" cy="50" r="2.3" fill="#1e40af"/>
  <!-- the eye: a lens in the bowl of the P -->
  <circle cx="36" cy="25" r="4.6" fill="#fbbf24"/>
  <circle cx="36" cy="25" r="1.9" fill="#1e3a8a"/>
</svg>
